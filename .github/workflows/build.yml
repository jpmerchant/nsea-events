name: Build and deploy events site
on:
  workflow_dispatch:
  schedule: [{cron: '0 * * * *'}]   # hourly refresh from the Google Sheet
  push: {branches: [main]}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node build.mjs
        env:
          EVENTS_CSV_URL: ${{ secrets.EVENTS_CSV_URL }}
          VENUES_CSV_URL: ${{ secrets.VENUES_CSV_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
